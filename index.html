<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درجات الطلاب</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* جعل الجسم يملأ كامل الشاشة */
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            text-align: center; /* محاذاة النص في المنتصف */
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            direction: rtl; /* التأكد من أن النص العربي يعرض من اليمين لليسار */
        }
        .hidden { display: none; }
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            direction: ltr; /* محاذاة النص في الحقول من اليسار لليمين */
        }
        .student-list {
            list-style: none;
            padding: 0;
        }
        .student-list li {
            background: #eee;
            margin: 5px 0;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: space-between; /* جعل النص في الجهة اليسرى والخيارات في الجهة اليمنى */
            align-items: center;
        }
        .student-list li:hover {
            background: #ddd;
        }
        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .school-logo {
            width: 120px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container" id="welcome-screen">
        <img src="مدرسه.jpg" alt="شعار المدرسة" class="school-logo">
        <h2>مرحبًا بكم في نظام درجات الطلاب</h2>
        <button onclick="startApp()">بدء</button>
    </div>
    
    <div class="container hidden" id="main-screen">
        <input type="text" id="search" placeholder="ابحث عن اسم الطالب" onkeyup="filterStudents()">
        <ul id="student-list" class="student-list"></ul>
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
    </div>
    
    <div id="password-modal" class="modal hidden">
        <p>أدخل رمز الدخول:</p>
        <input type="password" id="student-password">
        <button onclick="checkPassword()">تأكيد</button>
        <button onclick="closeModal('password-modal')">إلغاء</button>
    </div>
    
    <div id="admin-modal" class="modal hidden">
        <p>أدخل رمز المشرف:</p>
        <input type="password" id="admin-password">
        <button onclick="checkAdmin()">تفعيل المشرف</button>
        <button onclick="closeModal('admin-modal')">إلغاء</button>
    </div>
    
    <div class="container hidden" id="admin-panel">
        <h3>إدارة الطلاب</h3>
        <input type="text" id="new-student-name" placeholder="اسم الطالب">
        <input type="text" id="new-student-arabic" placeholder="اللغة العربية">
        <input type="text" id="new-student-islamic" placeholder="التربية الإسلامية">
        <input type="text" id="new-student-english" placeholder="الإنجليزي">
        <input type="text" id="new-student-social" placeholder="الدراسات الاجتماعية">
        <input type="text" id="new-student-biology" placeholder="الأحياء">
        <input type="text" id="new-student-physics" placeholder="الفيزياء">
        <input type="text" id="new-student-chemistry" placeholder="الكيمياء">
        <input type="text" id="new-student-computer" placeholder="الحاسوب">
        <input type="password" id="new-student-password" placeholder="رمز الدخول">
        <button onclick="addStudent()">إضافة طالب</button>
        <button onclick="disableAdminMode()">إلغاء وضع المشرف</button>
    </div>
    
    <div id="edit-modal" class="modal hidden">
        <h3>تعديل بيانات الطالب</h3>
        <input type="text" id="edit-student-name" placeholder="اسم الطالب">
        <input type="text" id="edit-student-arabic" placeholder="اللغة العربية">
        <input type="text" id="edit-student-islamic" placeholder="التربية الإسلامية">
        <input type="text" id="edit-student-english" placeholder="الإنجليزي">
        <input type="text" id="edit-student-social" placeholder="الدراسات الاجتماعية">
        <input type="text" id="edit-student-biology" placeholder="الأحياء">
        <input type="text" id="edit-student-physics" placeholder="الفيزياء">
        <input type="text" id="edit-student-chemistry" placeholder="الكيمياء">
        <input type="text" id="edit-student-computer" placeholder="الحاسوب">
        <button onclick="saveEdits()">حفظ التعديلات</button>
        <button onclick="closeModal('edit-modal')">إلغاء</button>
    </div>

    <script>
        let students = [{ name: "أحمد", grades: "عربي: 95, إسلامية: 88, إنجليزي: 76, اجتماعية: 85, أحياء: 92, فيزياء: 80, كيمياء: 78, حاسوب: 90", password: "1234" }];
        let adminMode = false;

        function startApp() {
            document.getElementById("welcome-screen").classList.add("hidden");
            document.getElementById("main-screen").classList.remove("hidden");
            updateStudentList();
        }

        function updateStudentList() {
            let list = document.getElementById("student-list");
            list.innerHTML = "";
            students.forEach((student, index) => {
                let li = document.createElement("li");
                li.innerHTML = `${student.name}`;
                if (adminMode) {
                    li.innerHTML += `<button onclick="editStudent(${index})">تعديل</button> <button onclick="deleteStudent(${index})">حذف</button>`;
                }
                list.appendChild(li);
            });
        }

        function filterStudents() {
            let search = document.getElementById("search").value.toLowerCase();
            let list = document.querySelectorAll(".student-list li");
            list.forEach(li => {
                li.style.display = li.textContent.toLowerCase().includes(search) ? "block" : "none";
            });
        }

        function openSettings() {
            document.getElementById("admin-modal").classList.remove("hidden");
        }

        function checkAdmin() {
            let inputPass = document.getElementById("admin-password").value;
            if (inputPass === "9999") {
                adminMode = true;
                document.getElementById("admin-panel").classList.remove("hidden");
                closeModal("admin-modal");
                updateStudentList();
            } else {
                alert("رمز المشرف خاطئ!");
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add("hidden");
        }

        function addStudent() {
            let name = document.getElementById("new-student-name").value;
            let arabic = document.getElementById("new-student-arabic").value;
            let islamic = document.getElementById("new-student-islamic").value;
            let english = document.getElementById("new-student-english").value;
            let social = document.getElementById("new-student-social").value;
            let biology = document.getElementById("new-student-biology").value;
            let physics = document.getElementById("new-student-physics").value;
            let chemistry = document.getElementById("new-student-chemistry").value;
            let computer = document.getElementById("new-student-computer").value;
            let password = document.getElementById("new-student-password").value;

            if (name && arabic && islamic && english && social && biology && physics && chemistry && computer && password) {
                students.push({
                    name: name,
                    grades: `عربي: ${arabic}, إسلامية: ${islamic}, إنجليزي: ${english}, اجتماعية: ${social}, أحياء: ${biology}, فيزياء: ${physics}, كيمياء: ${chemistry}, حاسوب: ${computer}`,
                    password: password
                });
                alert("تم إضافة الطالب بنجاح!");
                updateStudentList();
            } else {
                alert("من فضلك أكمل جميع الحقول!");
            }
        }

        function editStudent(index) {
            let student = students[index];
            document.getElementById("edit-student-name").value = student.name;
            document.getElementById("edit-student-arabic").value = student.grades.split(",")[0].split(":")[1].trim();
            document.getElementById("edit-student-islamic").value = student.grades.split(",")[1].split(":")[1].trim();
            document.getElementById("edit-student-english").value = student.grades.split(",")[2].split(":")[1].trim();
            document.getElementById("edit-student-social").value = student.grades.split(",")[3].split(":")[1].trim();
            document.getElementById("edit-student-biology").value = student.grades.split(",")[4].split(":")[1].trim();
            document.getElementById("edit-student-physics").value = student.grades.split(",")[5].split(":")[1].trim();
            document.getElementById("edit-student-chemistry").value = student.grades.split(",")[6].split(":")[1].trim();
            document.getElementById("edit-student-computer").value = student.grades.split(",")[7].split(":")[1].trim();

            document.getElementById("edit-modal").classList.remove("hidden");

            // حفظ التعديلات
            window.saveEdits = function() {
                student.name = document.getElementById("edit-student-name").value;
                student.grades = `عربي: ${document.getElementById("edit-student-arabic").value}, إسلامية: ${document.getElementById("edit-student-islamic").value}, إنجليزي: ${document.getElementById("edit-student-english").value}, اجتماعية: ${document.getElementById("edit-student-social").value}, أحياء: ${document.getElementById("edit-student-biology").value}, فيزياء: ${document.getElementById("edit-student-physics").value}, كيمياء: ${document.getElementById("edit-student-chemistry").value}, حاسوب: ${document.getElementById("edit-student-computer").value}`;
                closeModal("edit-modal");
                updateStudentList();
            };
        }

        function deleteStudent(index) {
            students.splice(index, 1);
            updateStudentList();
        }
    </script>
</body>
</html>
